    nics:
      - {rail: A, leaf: leaf1, interface: eth1, address: 10.210.0.2/30, gateway: 10.210.0.1, subnet: 10.210.0.0/30}
      - {rail: B, leaf: leaf3, interface: eth2, address: 10.210.1.2/30, gateway: 10.210.1.1, subnet: 10.210.1.0/30}
  - name: host2
    nics:
      - {rail: A, leaf: leaf1, interface: eth1, address: 10.210.0.6/30, gateway: 10.210.0.5, subnet: 10.210.0.4/30}
      - {rail: B, leaf: leaf3, interface: eth2, address: 10.210.1.6/30, gateway: 10.210.1.5, subnet: 10.210.1.4/30}
  - name: host3
    nics:
      - {rail: A, leaf: leaf2, interface: eth1, address: 10.210.0.10/30, gateway: 10.210.0.9, subnet: 10.210.0.8/30}
      - {rail: B, leaf: leaf4, interface: eth2, address: 10.210.1.10/30, gateway: 10.210.1.9, subnet: 10.210.1.8/30}
  - name: host4
    nics:
      - {rail: A, leaf: leaf2, interface: eth1, address: 10.210.0.14/30, gateway: 10.210.0.13, subnet: 10.210.0.12/30}
      - {rail: B, leaf: leaf4, interface: eth2, address: 10.210.1.14/30, gateway: 10.210.1.13, subnet: 10.210.1.12/30}
vm_hosts:
