    vcpus: 2
    management_mac: "52:54:00:01:00:01"
    nics:
      - {rail: A, leaf: leaf1, interface: eth1, address: 10.210.0.18/30, gateway: 10.210.0.17, subnet: 10.210.0.16/30, mac: "52:54:00:01:01:01"}
  - name: vmhost2
    memory_mib: 768
    vcpus: 2
    management_mac: "52:54:00:02:00:01"
    nics:
      - {rail: A, leaf: leaf2, interface: eth1, address: 10.210.0.22/30, gateway: 10.210.0.21, subnet: 10.210.0.20/30, mac: "52:54:00:02:01:01"}
links:
  - {name: spine1-leaf1, kind: fabric, a: {node: spine1, interface: eth1}, b: {node: leaf1, interface: eth1}}
  - {name: spine1-leaf2, kind: fabric, a: {node: spine1, interface: eth2}, b: {node: leaf2, interface: eth1}}
  - {name: spine1-leaf3, kind: fabric, a: {node: spine1, interface: eth3}, b: {node: leaf3, interface: eth1}}
  - {name: spine1-leaf4, kind: fabric, a: {node: spine1, interface: eth4}, b: {node: leaf4, interface: eth1}}
  - {name: spine2-leaf1, kind: fabric, a: {node: spine2, interface: eth1}, b: {node: leaf1, interface: eth2}}
  - {name: spine2-leaf2, kind: fabric, a: {node: spine2, interface: eth2}, b: {node: leaf2, interface: eth2}}
  - {name: spine2-leaf3, kind: fabric, a: {node: spine2, interface: eth3}, b: {node: leaf3, interface: eth2}}
  - {name: spine2-leaf4, kind: fabric, a: {node: spine2, interface: eth4}, b: {node: leaf4, interface: eth2}}
  - {name: host1-leaf1, kind: host, a: {node: host1, interface: eth1}, b: {node: leaf1, interface: eth3}}
  - {name: host2-leaf1, kind: host, a: {node: host2, interface: eth1}, b: {node: leaf1, interface: eth4}}
  - {name: host1-leaf3, kind: host, a: {node: host1, interface: eth2}, b: {node: leaf3, interface: eth3}}
  - {name: host2-leaf3, kind: host, a: {node: host2, interface: eth2}, b: {node: leaf3, interface: eth4}}
  - {name: host3-leaf2, kind: host, a: {node: host3, interface: eth1}, b: {node: leaf2, interface: eth3}}
  - {name: host4-leaf2, kind: host, a: {node: host4, interface: eth1}, b: {node: leaf2, interface: eth4}}
  - {name: host3-leaf4, kind: host, a: {node: host3, interface: eth2}, b: {node: leaf4, interface: eth3}}
  - {name: host4-leaf4, kind: host, a: {node: host4, interface: eth2}, b: {node: leaf4, interface: eth4}}
  - {name: vmhost1-leaf1, kind: host, a: {node: vmhost1, interface: eth1}, b: {node: leaf1, interface: eth5}}
  - {name: vmhost2-leaf2, kind: host, a: {node: vmhost2, interface: eth1}, b: {node: leaf2, interface: eth5}}
  - {name: ta1-leaf1, kind: tenant, a: {node: ta1, interface: eth1}, b: {node: leaf1, interface: eth6}}
  - {name: tb1-leaf1, kind: tenant, a: {node: tb1, interface: eth1}, b: {node: leaf1, interface: eth7}}
  - {name: ta3-leaf3, kind: tenant, a: {node: ta3, interface: eth1}, b: {node: leaf3, interface: eth5}}
  - {name: tb2-leaf2, kind: tenant, a: {node: tb2, interface: eth1}, b: {node: leaf2, interface: eth6}}
  - {name: tb4-leaf4, kind: tenant, a: {node: tb4, interface: eth1}, b: {node: leaf4, interface: eth5}}
bgp:
  spine_asn: 65000
  leaf_asn_base: 65101
  hold_seconds: 9
  keepalive_seconds: 3
  extended_nexthop: true
zebra:
  # false -> `no zebra nexthop kernel enable` on leaves (E8 §3 insertion fix, tested, not default)
  leaf_kernel_nexthop_groups: true
bfd:
  enabled: true
  transmit_ms: 100
  receive_ms: 100
  detect_multiplier: 3
ecmp_width: 2
images:
  frr: quay.io/frrouting/frr:10.2.1@sha256:c8543d3e0a1348cc0f2b19154fd8b0300e237773dbec65d9d6d6570c1d088deb
  # Built from fabric/images/roce-host/Containerfile (`make roce-image`) and
  # served by the local registry below; the digest is the pushed manifest.
  host: localhost:5000/goodput-roce-host:0.1.0@sha256:f6f2f4045e4f9a533cebb4435c8acc8f7182104d1dca19bf033f50455d0056e2
  # Built from fabric/images/roce-vm/Containerfile; image digest pinned below.
  vmrunner: localhost:5000/goodput-roce-vm:0.1.0@sha256:8b2c5ba8936c2d21dc657fe6b268857490360a5e6a3fa8e6172aeecce53b88f7
  # Tenant endpoints (EVPN front end); same pin used in F1 for hosts.
  tenant: docker.io/nicolaka/netshoot:v0.13@sha256:5a21d467fed653554bdc483ca5e7e866805c5b4c8f7ecb195a43f778c8d02fb8
  registry: docker.io/library/registry:3.1.1@sha256:3d527cee870ddd0fc8a31f99b2fdfb6451801a8dd4f5a92c1ec36dae24c14274
# SOFT-ROCE: one rdma_rxe device per host rail NIC, created inside the host
# container at deploy. Device names are global because the kernel RDMA
# subsystem runs in shared netns mode (`rdma system show`).
rdma:
  enabled: true
  provider: rxe
# Capture sidecars: the host image sharing a router's network namespace
# (containerlab network-mode container:<node>), so tcpdump/tshark run on the
# router's interfaces without adding tools to the pinned FRR image.
capture_taps: [spine1, spine2]
# Front-end multi-tenancy (EVPN-VXLAN, symmetric IRB). Each tenant is a VRF
# with an L3VNI; each (tenant, leaf) has its own routed L2VNI/subnet, so no
# L2 domain is stretched across the fabric. Route targets are explicit
# because leaves are in different ASes (auto AS:VNI RTs would not match).
# The backend rails stay in the default VRF and are not part of any tenant.
# fabric_mtu is the containerlab veth MTU, made explicit; tenant MTU leaves
# room for the 50 B VXLAN/UDP/IP/Ethernet overhead.
fabric_mtu: 9500
tenants:
  mtu: 9000
  gateway_mac: "02:00:00:00:fe:01"   # anycast gateway MAC on every tenant SVI
  vxlan_udp_port: 4789
  vrfs:
    - name: tenant-a
      table: 1001
      l3vni: 50001
      route_target: "65000:50001"
      segments:
        - {leaf: leaf1, l2vni: 10101, subnet: 10.220.11.0/24, route_target: "65000:10101"}
        - {leaf: leaf3, l2vni: 10103, subnet: 10.220.13.0/24, route_target: "65000:10103"}
      endpoints:
        - {name: ta1, leaf: leaf1, address: 10.220.11.10/24}
        - {name: ta3, leaf: leaf3, address: 10.220.13.10/24}
    - name: tenant-b
      table: 1002
      l3vni: 50002
      route_target: "65000:50002"
      segments:
        - {leaf: leaf1, l2vni: 10201, subnet: 10.220.21.0/24, route_target: "65000:10201"}
        - {leaf: leaf2, l2vni: 10202, subnet: 10.220.22.0/24, route_target: "65000:10202"}
        - {leaf: leaf4, l2vni: 10204, subnet: 10.220.24.0/24, route_target: "65000:10204"}
      endpoints:
        - {name: tb1, leaf: leaf1, address: 10.220.21.10/24}
        - {name: tb2, leaf: leaf2, address: 10.220.22.10/24}
        - {name: tb4, leaf: leaf4, address: 10.220.24.10/24}
# EMULATED lab profile (not a hardware design value): Linux TBF on both ends
# of every leaf<->spine veth so the fabric, not the host containers, is the
# bottleneck for E5-shaped and E6. Applied/removed at runtime with
# `make fabric-shape-on/off`; BGP/BFD are untouched. pin_rail selects the
# hosts whose cross-leaf pairs get the even-split pinning baseline. The rate
# is justified in E5 "Shaped uplinks rerun" from measured host throughput.
lab_shaping:
  uplink_rate_mbit: 500
  burst_bytes: 125000          # 2 ms at 500 Mbit/s; >= rate/HZ (tc-tbf(8))
  limit_bytes: 625000          # 10 ms of queue at 500 Mbit/s
  pin_rail: A
# INTENT-ONLY lossless RoCE v2 QoS design. Rendered to SONiC config_db
# fragments (never run on hardware) and to a Linux tc equivalent that runs on
# the lab host rail NICs. Veth has no PFC, no switch buffers and no queue ECN
# marking; the lab verifies classification only. Sources for every default
# are in fabric/qos/README.md.
qos:
  target:
    port_speed_gbps: 400       # hardware design target, not the veth lab
    port_mtu: 9100
    roce_mtu: 4096
    sonic_port_stride: 8       # placeholder ethN -> Ethernet{(N-1)*stride}
  classes:
    - {name: roce, role: roce, dscp: [26], tc: 3, queue: 3, priority_group: 3, lossless: true, pfc_priority: 3, scheduler: {type: DWRR, weight: 50}}
    - {name: cnp, role: cnp, dscp: [48], tc: 6, queue: 6, priority_group: 0, lossless: false, scheduler: {type: STRICT}}
    - {name: default, role: default, dscp: [], tc: 0, queue: 0, priority_group: 0, lossless: false, scheduler: {type: DWRR, weight: 50}}
  pfc:
    priorities: [3]
    # Ingress PG occupancy that sends PAUSE (SONiC static_th). Design choice:
    # 2x ECN Kmax, so ECN always marks before PFC can trigger.
    xoff_threshold_bytes: 3000000
    xon_bytes: 2288            # SONiC 202511 Configuration.md example value
    reserved_bytes: 1248       # SONiC 202511 Configuration.md example value
    mtu_s_bytes: 4200          # RoCE 4096 payload + headers on the paused priority
  ecn:
    tc: 3
    kmin_bytes: 150000         # Cumulus Linux 5.16 RoCE default min-threshold
    kmax_bytes: 1500000        # Cumulus Linux 5.16 RoCE default max-threshold
    pmax_percent: 100          # Cumulus Linux 5.16 RoCE default probability
  pfc_watchdog:                # sonic-utilities 202511 pfcwd defaults
    action: drop
    detection_ms: 200
    restoration_ms: 200
    poll_ms: 200
  cable_length_m:
    fabric: 10
    host: 3
    links: {}                  # per-link override, e.g. {spine1-leaf1: 100}
