name: goodput-fabric
address_plan:
  loopbacks: 10.200.0.0/24
  hosts: 10.210.0.0/16
  management: 10.253.0.0/24
  tenants: 10.220.0.0/16       # front-end tenant VRF subnets (EVPN-VXLAN)
  fabric_p2p: 10.201.0.0/24    # /31 per fabric link, numbered NX-OS render only (lab runs unnumbered)
  excluded:
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 10.89.0.0/24
rails: [A, B]
nodes:
  - {name: spine1, role: spine, asn: 65000, loopback: 10.200.0.1/32}
  - {name: spine2, role: spine, asn: 65000, loopback: 10.200.0.2/32}
  - {name: leaf1, role: leaf, asn: 65101, loopback: 10.200.0.11/32}
  - {name: leaf2, role: leaf, asn: 65102, loopback: 10.200.0.12/32}
  - {name: leaf3, role: leaf, asn: 65103, loopback: 10.200.0.13/32}
  - {name: leaf4, role: leaf, asn: 65104, loopback: 10.200.0.14/32}
hosts:
