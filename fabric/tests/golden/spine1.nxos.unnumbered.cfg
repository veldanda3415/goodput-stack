!RANCID-CONTENT-TYPE: cisco-nx
! spine1: rendered from fabric/intent/fabric.yaml (unnumbered underlay); OFFLINE-VALIDATED only
hostname spine1
feature bgp
feature bfd
!
interface loopback0
  description router-id
  ip address 10.200.0.1/32
!
interface Ethernet1/1
  description fabric leaf1 Ethernet1/1 (spine1-leaf1)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/2
  description fabric leaf2 Ethernet1/1 (spine1-leaf2)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/3
  description fabric leaf3 Ethernet1/1 (spine1-leaf3)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/4
  description fabric leaf4 Ethernet1/1 (spine1-leaf4)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
router bgp 65000
  router-id 10.200.0.1
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.200.0.1/32
    maximum-paths 2
  neighbor Ethernet1/1
    remote-as 65101
    description leaf1
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor Ethernet1/2
    remote-as 65102
    description leaf2
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor Ethernet1/3
    remote-as 65103
    description leaf3
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor Ethernet1/4
    remote-as 65104
    description leaf4
    timers 3 9
    bfd
    address-family ipv4 unicast
