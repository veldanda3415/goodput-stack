!RANCID-CONTENT-TYPE: cisco-nx
! leaf2: rendered from fabric/intent/fabric.yaml (numbered underlay); OFFLINE-VALIDATED only
hostname leaf2
feature bgp
feature bfd
!
interface loopback0
  description router-id
  ip address 10.200.0.12/32
!
interface Ethernet1/1
  description fabric spine1 Ethernet1/2 (spine1-leaf2)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.3/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/2
  description fabric spine2 Ethernet1/2 (spine2-leaf2)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.11/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/3
  description rail A host3
  no switchport
  mtu 9216
  ip address 10.210.0.9/30
  no shutdown
!
interface Ethernet1/4
  description rail A host4
  no switchport
  mtu 9216
  ip address 10.210.0.13/30
  no shutdown
!
interface Ethernet1/5
  description rail A vmhost2
  no switchport
  mtu 9216
  ip address 10.210.0.21/30
  no shutdown
!
router bgp 65102
  router-id 10.200.0.12
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.200.0.12/32
    network 10.210.0.12/30
    network 10.210.0.20/30
    network 10.210.0.8/30
    maximum-paths 2
  neighbor 10.201.0.2
    remote-as 65000
    description spine1
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor 10.201.0.10
    remote-as 65000
    description spine2
    timers 3 9
    bfd
    address-family ipv4 unicast
