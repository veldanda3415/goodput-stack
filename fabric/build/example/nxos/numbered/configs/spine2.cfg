!RANCID-CONTENT-TYPE: cisco-nx
! spine2: rendered from fabric/intent/fabric.yaml (numbered underlay); OFFLINE-VALIDATED only
hostname spine2
feature bgp
feature bfd
!
interface loopback0
  description router-id
  ip address 10.200.0.2/32
!
interface Ethernet1/1
  description fabric leaf1 Ethernet1/2 (spine2-leaf1)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.8/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/2
  description fabric leaf2 Ethernet1/2 (spine2-leaf2)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.10/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/3
  description fabric leaf3 Ethernet1/2 (spine2-leaf3)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.12/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/4
  description fabric leaf4 Ethernet1/2 (spine2-leaf4)
  no switchport
  mtu 9216
  no ip redirects
  ip address 10.201.0.14/31
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
router bgp 65000
  router-id 10.200.0.2
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.200.0.2/32
    maximum-paths 2
  neighbor 10.201.0.9
    remote-as 65101
    description leaf1
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor 10.201.0.11
    remote-as 65102
    description leaf2
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor 10.201.0.13
    remote-as 65103
    description leaf3
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor 10.201.0.15
    remote-as 65104
    description leaf4
    timers 3 9
    bfd
    address-family ipv4 unicast
