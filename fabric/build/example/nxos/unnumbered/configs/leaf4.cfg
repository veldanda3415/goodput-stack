!RANCID-CONTENT-TYPE: cisco-nx
! leaf4: rendered from fabric/intent/fabric.yaml (unnumbered underlay); OFFLINE-VALIDATED only
hostname leaf4
feature bgp
feature bfd
!
interface loopback0
  description router-id
  ip address 10.200.0.14/32
!
interface Ethernet1/1
  description fabric spine1 Ethernet1/4 (spine1-leaf4)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/2
  description fabric spine2 Ethernet1/4 (spine2-leaf4)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/3
  description rail B host3
  no switchport
  mtu 9216
  ip address 10.210.1.9/30
  no shutdown
!
interface Ethernet1/4
  description rail B host4
  no switchport
  mtu 9216
  ip address 10.210.1.13/30
  no shutdown
!
router bgp 65104
  router-id 10.200.0.14
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.200.0.14/32
    network 10.210.1.12/30
    network 10.210.1.8/30
    maximum-paths 2
  neighbor Ethernet1/1
    remote-as 65000
    description spine1
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor Ethernet1/2
    remote-as 65000
    description spine2
    timers 3 9
    bfd
    address-family ipv4 unicast
