!RANCID-CONTENT-TYPE: cisco-nx
! leaf1: rendered from fabric/intent/fabric.yaml (unnumbered underlay); OFFLINE-VALIDATED only
hostname leaf1
feature bgp
feature bfd
!
interface loopback0
  description router-id
  ip address 10.200.0.11/32
!
interface Ethernet1/1
  description fabric spine1 Ethernet1/1 (spine1-leaf1)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/2
  description fabric spine2 Ethernet1/1 (spine2-leaf1)
  no switchport
  mtu 9216
  no ip redirects
  ipv6 address use-link-local-only
  ipv6 link-local use-bia
  ip forward
  bfd interval 100 min_rx 100 multiplier 3
  no shutdown
!
interface Ethernet1/3
  description rail A host1
  no switchport
  mtu 9216
  ip address 10.210.0.1/30
  no shutdown
!
interface Ethernet1/4
  description rail A host2
  no switchport
  mtu 9216
  ip address 10.210.0.5/30
  no shutdown
!
interface Ethernet1/5
  description rail A vmhost1
  no switchport
  mtu 9216
  ip address 10.210.0.17/30
  no shutdown
!
router bgp 65101
  router-id 10.200.0.11
  log-neighbor-changes
  address-family ipv4 unicast
    network 10.200.0.11/32
    network 10.210.0.0/30
    network 10.210.0.16/30
    network 10.210.0.4/30
    maximum-paths 2
  neighbor Ethernet1/1
    remote-as 65000
    description spine1
    timers 3 9
    bfd
    address-family ipv4 unicast
  neighbor Ethernet1/2
    remote-as 65000
    description spine2
    timers 3 9
    bfd
    address-family ipv4 unicast
