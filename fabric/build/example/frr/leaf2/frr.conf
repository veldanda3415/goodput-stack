frr defaults traditional
hostname leaf2
log stdout
service integrated-vtysh-config
!
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.200.0.12/32
!

interface eth3
 ip address 10.210.0.9/30
!

interface eth4
 ip address 10.210.0.13/30
!

interface eth5
 ip address 10.210.0.21/30
!


bfd
 profile FABRIC
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
!

vrf tenant-b
 vni 50002
exit-vrf
!
route-map FABRIC-IN permit 10
!
route-map FABRIC-OUT permit 10
!
router bgp 65102 vrf tenant-b
 bgp router-id 10.200.0.12
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:50002
  route-target export 65000:50002
 exit-address-family
!
router bgp 65102
 bgp router-id 10.200.0.12
 no bgp default ipv4-unicast
 bgp log-neighbor-changes

 neighbor FABRIC peer-group
 neighbor FABRIC remote-as 65000
 neighbor FABRIC timers 3 9
 neighbor FABRIC route-map FABRIC-IN in
 neighbor FABRIC route-map FABRIC-OUT out

 neighbor FABRIC capability extended-nexthop


 neighbor FABRIC bfd profile FABRIC


 neighbor eth1 interface peer-group FABRIC

 neighbor eth2 interface peer-group FABRIC


 address-family ipv4 unicast

  network 10.200.0.12/32

  network 10.210.0.12/30

  network 10.210.0.20/30

  network 10.210.0.8/30


  neighbor FABRIC activate

  maximum-paths 2
 exit-address-family
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC route-map FABRIC-IN in
  neighbor FABRIC route-map FABRIC-OUT out
  advertise-all-vni
  vni 10202
   route-target import 65000:10202
   route-target export 65000:10202
  exit-vni
 exit-address-family
!
