frr defaults traditional
hostname leaf1
log stdout
service integrated-vtysh-config
!
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.200.0.11/32
!

interface eth3
 ip address 10.210.0.1/30
!

interface eth4
 ip address 10.210.0.5/30
!


bfd
 profile FABRIC
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
!

route-map FABRIC-IN permit 10
!
route-map FABRIC-OUT permit 10
!
router bgp 65101
 bgp router-id 10.200.0.11
 no bgp default ipv4-unicast
 bgp log-neighbor-changes
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 3 9
 neighbor FABRIC route-map FABRIC-IN in
 neighbor FABRIC route-map FABRIC-OUT out

 neighbor FABRIC capability extended-nexthop


 neighbor FABRIC bfd profile FABRIC


 neighbor eth1 interface peer-group FABRIC

 neighbor eth2 interface peer-group FABRIC

 address-family ipv4 unicast

  network 10.200.0.11/32

  network 10.210.0.0/30

  network 10.210.0.4/30

  neighbor FABRIC activate
  maximum-paths 2
 exit-address-family
!
