frr defaults traditional
hostname spine2
log stdout
service integrated-vtysh-config
!
ip forwarding
ipv6 forwarding
!
interface lo
 ip address 10.200.0.2/32
!


bfd
 profile FABRIC
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
!

route-map FABRIC-IN permit 10
!
route-map FABRIC-OUT permit 10
!
router bgp 65000
 bgp router-id 10.200.0.2
 no bgp default ipv4-unicast
 bgp log-neighbor-changes

 neighbor PEER_LEAF1 peer-group
 neighbor PEER_LEAF1 remote-as 65101
 neighbor PEER_LEAF1 timers 3 9
 neighbor PEER_LEAF1 route-map FABRIC-IN in
 neighbor PEER_LEAF1 route-map FABRIC-OUT out

 neighbor PEER_LEAF1 capability extended-nexthop


 neighbor PEER_LEAF1 bfd profile FABRIC


 neighbor eth1 interface peer-group PEER_LEAF1


 neighbor PEER_LEAF2 peer-group
 neighbor PEER_LEAF2 remote-as 65102
 neighbor PEER_LEAF2 timers 3 9
 neighbor PEER_LEAF2 route-map FABRIC-IN in
 neighbor PEER_LEAF2 route-map FABRIC-OUT out

 neighbor PEER_LEAF2 capability extended-nexthop


 neighbor PEER_LEAF2 bfd profile FABRIC


 neighbor eth2 interface peer-group PEER_LEAF2


 neighbor PEER_LEAF3 peer-group
 neighbor PEER_LEAF3 remote-as 65103
 neighbor PEER_LEAF3 timers 3 9
 neighbor PEER_LEAF3 route-map FABRIC-IN in
 neighbor PEER_LEAF3 route-map FABRIC-OUT out

 neighbor PEER_LEAF3 capability extended-nexthop


 neighbor PEER_LEAF3 bfd profile FABRIC


 neighbor eth3 interface peer-group PEER_LEAF3


 neighbor PEER_LEAF4 peer-group
 neighbor PEER_LEAF4 remote-as 65104
 neighbor PEER_LEAF4 timers 3 9
 neighbor PEER_LEAF4 route-map FABRIC-IN in
 neighbor PEER_LEAF4 route-map FABRIC-OUT out

 neighbor PEER_LEAF4 capability extended-nexthop


 neighbor PEER_LEAF4 bfd profile FABRIC


 neighbor eth4 interface peer-group PEER_LEAF4


 address-family ipv4 unicast

  network 10.200.0.2/32


  neighbor PEER_LEAF1 activate

  neighbor PEER_LEAF2 activate

  neighbor PEER_LEAF3 activate

  neighbor PEER_LEAF4 activate

  maximum-paths 2
 exit-address-family
!
