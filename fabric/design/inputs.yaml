# Inputs for fabric/design/collectives.py and sizing.py.
# Every number is either cited (Sx in sources.md) or an explicit assumption (Ax).
# Outputs computed from these inputs are CALCULATED, not measured.

hardware:
  name: DGX H100 (8 x H100 SXM)
  gpus_per_node: 8            # S1
  nics_per_node: 8            # S1: 8 x ConnectX-7 single port, one per GPU (rail-optimized)
  nic_gbps: 400               # S1
  nvlink_gbytes_per_dir: 450  # S4: 18 links x 25 GB/s each direction (900 GB/s is both directions)
  gpu_dense_tflops: 989.5     # S5: 1,979 TFLOPS BF16 "with sparsity" / 2
  node_power_kw: 10.2         # S1

efficiency:                   # A1, A2: fraction of line rate achieved by large collectives
  network: 0.80
  nvlink: 0.80
alpha_us:                     # A3, A4: per-step latency
  network: 5.0
  nvlink: 1.0
mfu: 0.40                     # A5
overlap: 0.0                  # A6: fraction of communication hidden behind compute

models:                       # S13 (Llama 3), S14 (Llama 3.2 3B), S18 + A9 (Mixtral)
  llama3-8b:    {params: 8.0e+9,   layers: 32,  hidden: 4096,  kv_heads: 8, head_dim: 128}
  llama3-70b:   {params: 70.0e+9,  layers: 80,  hidden: 8192,  kv_heads: 8, head_dim: 128}
  llama3-405b:  {params: 405.0e+9, layers: 126, hidden: 16384, kv_heads: 8, head_dim: 128}
  llama3.2-3b:  {params: 3.2e+9,   layers: 28,  hidden: 3072,  kv_heads: 8, head_dim: 128}
  mixtral-8x7b: {params: 47.0e+9, active_params: 13.0e+9, layers: 32, hidden: 4096,
                 kv_heads: 8, head_dim: 128, experts: 8, top_k: 2}

# Training examples. Rank layout is TP innermost, then DP, then PP (Megatron-style);
# EP groups are carved from consecutive DP ranks. World size = TP x DP x PP.
training:
  - {name: "8B on 256 GPUs",    model: llama3-8b,    dtype_bytes: 2, tp: 1, pp: 1,  dp: 256, ep: 1,
     seq_len: 8192, micro_batch: 1, microbatches: 1}
  - {name: "70B on 256 GPUs",   model: llama3-70b,   dtype_bytes: 2, tp: 8, pp: 4,  dp: 8,   ep: 1,
     seq_len: 8192, micro_batch: 1, microbatches: 16}
  - {name: "405B on 2,048 GPUs", model: llama3-405b, dtype_bytes: 2, tp: 8, pp: 16, dp: 16,  ep: 1,
     seq_len: 8192, micro_batch: 1, microbatches: 32}
  - {name: "Mixtral 8x7B on 256 GPUs", model: mixtral-8x7b, dtype_bytes: 2, tp: 2, pp: 1, dp: 128, ep: 8,
     seq_len: 4096, micro_batch: 1, microbatches: 1}

slow_link:
  workload: 8B on 256 GPUs
  rate_fraction: 0.5          # one NIC/link at 50 % of line rate

# Prefill/decode disaggregation: KV cache moves prefill GPU -> decode GPU over scale-out.
inference:
  - {model: llama3.2-3b, dtype_bytes: 2, prompt_tokens: 2048, requests_per_s: 10}
  - {model: llama3-8b,   dtype_bytes: 2, prompt_tokens: 4096, requests_per_s: 20}
  - {model: llama3-70b,  dtype_bytes: 2, prompt_tokens: 4096, requests_per_s: 20}
  - {model: llama3-70b,  dtype_bytes: 2, prompt_tokens: 32768, requests_per_s: 5}
