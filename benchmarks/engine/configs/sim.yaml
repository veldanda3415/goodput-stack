# ENGINE benchmarks against the vLLM SIMULATOR (llm-d-inference-sim) running in k3s.
# Every number here is SIMULATED: the simulator sleeps for the latency it is configured with.
# What these runs test is the measurement path (client, Service, metrics), the queueing model
# and the calibration against llama.cpp - not engine speed.
#
# Same layering and experiment names as llamacpp.yaml, so `compare` can line runs up:
#   make bench-sim EXP=smoke
#   make bench-compare A=benchmarks/results/engine/<ts>_ttft B=benchmarks/results/sim/<ts>_ttft
#
# Server side = the chart's simulator Deployment (helm upgrade first). Per point the harness
# rolls it (fresh pods, fresh counters); `server.sim` overrides are patched into its ConfigMap
# for the experiment and the release's config is restored afterwards.

defaults:
  server:
    runtime: k8s                 # existing Deployment; nothing is spawned locally
    namespace: inference
    deployment: inf-vllm-sim
    service: inf-vllm-sim
    configmap: inf-vllm-sim      # the simulator's --config; null = never patch it
    config_key: config.yaml
    health_path: /health/ready
    base_url: null               # null = Service ClusterIP (works on the k3s node); else e.g. a port-forward URL
    restart_per_point: true      # roll the pods before every point, like a fresh llama-server
    startup_timeout_s: 180
    sim: {}                      # simulator flag overrides (keys as in values.yaml sim.config)

  client:
    api: openai                  # /v1/completions + vLLM /tokenize; usage instead of timings
    endpoint: /v1/completions
    model: qwen2.5-0.5b-instruct # the served name (sim.config.model)
    prompt_tokens: 256           # exact in the SIMULATOR's tokenizer (dummy: ~1 token per word)
    max_tokens: 128
    ignore_eos: true             # honored by the simulator: exactly max_tokens are streamed
    temperature: 0.0
    cache_prompt: false          # llama.cpp-only; ignored here
    concurrency: 1
    requests: 20
    requests_per_client: null
    min_requests: 0
    max_tokens_jitter: 0
    start_jitter_s: 0
    warmup: 2
    timeout_s: 300

  metrics:
    scrape_interval_s: 1.0       # vllm:* gauges + histograms; server means are taken after warmup
    rss_interval_s: 0.25         # unused for k8s targets

  repeats: 1                     # seeded simulator: repeats only show scheduling noise

  slo:
    ttft_ms: null
    tpot_ms: null

  guards:
    min_free_ram_mib: 1024

  storage:
    results_dir: benchmarks/results/sim   # kept apart from real engine results on purpose
    max_log_mib: 20
    keep_raw_runs: 10

batch: [smoke, ttft, slot_limit, ttft_load, saturation]

experiments:
  smoke:
    description: Harness + Service path sanity check against the simulator - 3 requests, tiny prompt.
    client: {prompt_tokens: 32, max_tokens: 16, requests: 3, warmup: 1}
    report:
      columns: [requests_ok, usage_token_mismatch, prompt_n_mean, ttft_ms_p50, m_srv_ttft_ms_mean,
                ttft_minus_srv_ttft_ms_mean, itl_ms_p50, e2e_ms_p50, startup_s]
      derive: [sim_model]

  ttft:
    description: >
      Single-client TTFT vs prompt length. The simulator's per-token prefill model is linear
      (15 ms + 2.4 ms/token, fitted to llama.cpp at 16..512 tokens); llama.cpp on CPU is
      super-linear, so the two should agree for short prompts and diverge for long ones.
    server:
      sim: {max-model-len: 8192}   # room for the 4096-token prompt (llama.cpp ran with -c 8192)
    client: {max_tokens: 32, requests: 15}
    sweep:
      client.prompt_tokens: [16, 128, 512, 2048, 4096]
    report:
      columns: [prompt_n_mean, ttft_ms_p50, ttft_ms_p95, m_srv_ttft_ms_mean, m_srv_prefill_ms_mean,
                ttft_minus_srv_ttft_ms_mean, itl_ms_p50]
      look_for: >
        TTFT should equal the configured model (overhead + tokens x per-token cost) plus a small,
        flat "TTFT - server TTFT" (HTTP + Service hop). Compare with the llama.cpp `ttft` run to
        see where a linear prefill model stops describing the real CPU.
      derive: [sim_model]

  slot_limit:
    description: >
      Queueing only: no load slowdown (time-factor-under-load 1.0), so a running request takes
      the same time however many run. Clients beyond max-num-seqs must wait for one to finish.
    server:
      sim: {time-factor-under-load: 1.0}
    client: {prompt_tokens: 256, max_tokens: 64, requests: 24}
    sweep:
      server.sim.max-num-seqs: [1, 2, 4]
      client.concurrency: [1, 2, 4, 8]
    report:
      columns: [ttft_ms_p50, ttft_ms_p95, m_srv_queue_ms_mean, ttft_minus_srv_ttft_ms_mean,
                tpot_ms_p50, agg_output_tok_s, m_deferred_max, m_processing_max]
      look_for: >
        With clients <= max-num-seqs TTFT and TPOT stay flat (nothing is shared). Above it, TTFT
        jumps by about one request's duration per extra wave, server queue time > 0 and
        "max queued" = clients - max-num-seqs. This is the queue signal KEDA will scale on.
      derive: [queueing, sim_model]

  ttft_load:
    description: >
      TTFT under concurrent clients per prompt length, max-num-seqs 4 like llama.cpp -np 4.
      Load factor 2.4 = llama.cpp TPOT at 4 clients / 1 client (35.9 / 14.8 ms, 128-token prompts).
    server:
      sim: {max-num-seqs: 4, time-factor-under-load: 2.4}
    client: {max_tokens: 32, requests: 16}
    sweep:
      client.prompt_tokens: [128, 512, 2048]
      client.concurrency: [1, 2, 4, 8]
    report:
      columns: [ttft_ms_p50, ttft_ms_p95, ttft_ms_max, m_srv_queue_ms_mean, m_srv_prefill_ms_mean,
                tpot_ms_p50, m_deferred_max, agg_output_tok_s]
      look_for: >
        Up to 4 clients the simulator slows prefill/decode by the load factor (linear in running
        requests); above 4 requests also queue. Unlike llama.cpp, the slowdown does not depend on
        prompt length - a long prefill doesn't steal time from other clients' decode here.
      derive: [sim_model]

  saturation:
    description: >
      Same load as the llama.cpp saturation run: 16 running requests, clients 1..24.
      Load factor 10.1 = llama.cpp TPOT at 16 clients / 1 client (157.4 / 15.6 ms).
    server:
      sim: {max-num-seqs: 16, time-factor-under-load: 10.1}
    client:
      prompt_tokens: 256
      max_tokens: 128
      requests_per_client: 4
      min_requests: 24
      max_tokens_jitter: 0.25
      start_jitter_s: 3.0
    slo: {ttft_ms: 2000, tpot_ms: 50}
    sweep:
      client.concurrency: [1, 2, 4, 6, 8, 12, 16, 24]
    report:
      columns: [requests_ok, tpot_ms_p50, tpot_ms_p95, ttft_ms_p50, ttft_ms_p95, steady_output_tok_s,
                slo_attainment_pct, goodput_tok_s, m_deferred_max, m_srv_queue_ms_mean]
      look_for: >
        The simulator's slowdown is linear in running requests, llama.cpp's is not, so the
        endpoints (1 and 16 clients) match by construction and the middle shows how far a linear
        load model is off. Beyond 16 clients requests queue, as on llama.cpp.
      derive: [saturation, sim_model]
