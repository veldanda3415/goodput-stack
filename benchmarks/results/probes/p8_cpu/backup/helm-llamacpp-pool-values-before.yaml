httpRoute:
  create: true
  headerMatches:
    x-pool: cpu
  inferenceGatewayName: inference-gateway
provider:
  name: none
router:
  epp:
    pluginsConfigFile: llamacpp-plugins.yaml
    pluginsCustomConfig:
      llamacpp-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: metrics-data-source
          parameters:
            scheme: "http"
            path: "/metrics"
            insecureSkipVerify: true
        - type: core-metrics-extractor
          parameters:
            engineConfigs:
            - name: llamacpp           # matched against the pod label llm-d.ai/engine-type
              queuedRequestsSpec:  "llamacpp:requests_deferred"
              runningRequestsSpec: "llamacpp:requests_processing"
              kvUsageSpec: ""          # not exported by b11146 → GAPS.md
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer   # kept on purpose: the probe should show it adds nothing
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
  modelServers:
    matchLabels:
      app.kubernetes.io/instance: inf
      app.kubernetes.io/name: llamacpp
    targetPorts:
    - number: 8080
  monitoring:
    prometheus:
      auth:
        enabled: false
