gateway:
  className: agentgateway
  enabled: true
  listeners:
  - name: http
    port: 80
    protocol: HTTP
  name: inference-gateway
  proxy:
    pdbMinAvailable: 1
    replicas: 2
    softAntiAffinity: true
llamacpp:
  autoscaled: true
  enabled: true
  image:
    pullPolicy: Never
    repository: localhost/llama-server
    tag: b11146
  model:
    alias: qwen2.5-0.5b-instruct
    file: qwen2.5-0.5b-instruct-q4_k_m.gguf
    hostPath:
      path: /var/lib/goodput/models
    pvc:
      size: 2Gi
      storageClass: local-path
    source: pvc
    url: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  preStopSleepSeconds: 5
  probes:
    liveness:
      failureThreshold: 6
      periodSeconds: 10
    readiness:
      failureThreshold: 2
      periodSeconds: 5
    startup:
      failureThreshold: 300
      periodSeconds: 1
  replicas: 1
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: "4"
      memory: 1Gi
  server:
    ctxSize: 4096
    extraArgs: []
    parallel: 2
    port: 8080
    threads: 4
  service:
    port: 8080
    type: ClusterIP
  spreadAcrossNodes: false
  terminationGracePeriodSeconds: 60
networkPolicy:
  allowFrom:
  - gateway.networking.k8s.io/gateway-name: inference-gateway
  - llm-d.ai/igw-mode: llm-d-router-gateway
  - app.kubernetes.io/component: sanity-test
  allowFromNamespaces:
  - namespace: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus
  enabled: true
sim:
  autoscaled: true
  config:
    force-dummy-tokenizer: true
    inter-token-latency: 16.3ms
    inter-token-latency-std-dev: 1ms
    latency-calculator: per-token
    max-model-len: 4096
    max-num-seqs: 2
    mode: random
    model: qwen2.5-0.5b-instruct
    prefill-overhead: 15ms
    prefill-time-per-token: 2.4ms
    prefill-time-std-dev: 15ms
    seed: 42
    time-factor-under-load: 1
  enabled: true
  image:
    digest: sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
    pullPolicy: IfNotPresent
    repository: ghcr.io/llm-d/llm-d-inference-sim
    tag: v0.10.2
  port: 8000
  preStopSleepSeconds: 5
  probes:
    liveness:
      failureThreshold: 6
      periodSeconds: 10
    readiness:
      failureThreshold: 2
      periodSeconds: 5
    startup:
      failureThreshold: 120
      periodSeconds: 1
  replicas: 2
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  service:
    type: ClusterIP
  spreadAcrossNodes: false
  terminationGracePeriodSeconds: 30
