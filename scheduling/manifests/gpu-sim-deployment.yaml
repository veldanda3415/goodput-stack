# "GPU pod" = llm-d-inference-sim v0.10.2 (SIMULATED vLLM, no model, no GPU) asking for nvidia.com/gpu: 1.
# Image/digest: deploy/charts/inference/values.yaml (sim.image).
apiVersion: apps/v1
kind: Deployment
metadata: {name: gpu-sim, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: gpu-sim}}
  template:
    metadata: {labels: {app: gpu-sim}}
    spec:
      enableServiceLinks: false
      nodeSelector: {gpu-pool: t4}
      tolerations:
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim@sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
          args: ["--model", "sim-model", "--force-dummy-tokenizer", "--port", "8000"]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, periodSeconds: 2}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi, nvidia.com/gpu: 1}
