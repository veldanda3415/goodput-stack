# Shared ResourceClaim used by two pods (SIMULATED). Selects by attribute (CEL) and carries a TimeSlicing opaque config.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata: {name: shared-gpu, namespace: dra-demo}
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          selectors:
            - cel: {expression: "device.attributes['gpu.nvidia.com'].productName == 'Tesla-T4'"}
    config:
      - requests: ["gpu"]
        opaque:
          driver: gpu.nvidia.com
          parameters:
            apiVersion: gpu.resource.example.com/v1alpha1
            kind: GpuConfig
            sharing:
              strategy: TimeSlicing
              timeSlicingConfig: {interval: Default}
---
apiVersion: v1
kind: Pod
metadata: {name: shared-0, namespace: dra-demo}
spec:
  enableServiceLinks: false
  nodeSelector: {gpu-pool: t4}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  containers:
    - name: sim
      image: ghcr.io/llm-d/llm-d-inference-sim@sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
      args: ["--model", "sim-model", "--force-dummy-tokenizer", "--port", "8000"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
        claims: [{name: gpu}]
  resourceClaims:
    - name: gpu
      resourceClaimName: shared-gpu
---
apiVersion: v1
kind: Pod
metadata: {name: shared-1, namespace: dra-demo}
spec:
  enableServiceLinks: false
  nodeSelector: {gpu-pool: t4}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  containers:
    - name: sim
      image: ghcr.io/llm-d/llm-d-inference-sim@sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
      args: ["--model", "sim-model", "--force-dummy-tokenizer", "--port", "8000"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
        claims: [{name: gpu}]
  resourceClaims:
    - name: gpu
      resourceClaimName: shared-gpu
