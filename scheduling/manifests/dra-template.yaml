# DRA demo on the fake-gpu-operator 0.2.1 DRA plugin (driver gpu.nvidia.com, DeviceClass gpu.nvidia.com). SIMULATED.
# API: resource.k8s.io/v1 (checked with `kubectl explain resourceclaim.spec.devices.requests.exactly`);
# shapes follow test/e2e/fixtures/manifests/{basic-pod,shared-claim-pods,timeslicing-pod}.yaml at tag v0.2.1.
apiVersion: v1
kind: Namespace
metadata: {name: dra-demo}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: one-gpu, namespace: dra-demo}
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: {deviceClassName: gpu.nvidia.com}
---
apiVersion: v1
kind: Pod
metadata: {name: from-template, namespace: dra-demo}
spec:
  enableServiceLinks: false
  nodeSelector: {gpu-pool: t4}
  tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
  containers:
    - name: sim
      image: ghcr.io/llm-d/llm-d-inference-sim@sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
      args: ["--model", "sim-model", "--force-dummy-tokenizer", "--port", "8000"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
        claims: [{name: gpu}]
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: one-gpu
