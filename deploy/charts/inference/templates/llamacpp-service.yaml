{{- $c := .Values.llamacpp -}}
{{- if $c.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference.llamacpp.name" . }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
    {{- include "inference.llamacpp.selector" . | nindent 4 }}
    goodput-stack/pool: cpu
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "inference.llamacpp.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
