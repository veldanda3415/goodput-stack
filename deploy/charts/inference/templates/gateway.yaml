{{- $g := .Values.gateway -}}
{{- if $g.enabled }}
# Gateway API entry point for both InferencePools. The HTTPRoutes and EPPs are separate Helm
# releases of llm-d-router-gateway (sim-pool, llamacpp-pool; `make epp-deploy`): that chart names
# every object after .Release.Name, so it can't be a dependency of this chart twice (ADR 0002).
# Its proxy pods carry gateway.networking.k8s.io/gateway-name=<name>, which networkPolicy.allowFrom uses.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  {{- if gt (int $g.proxy.replicas) 0 }}
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ $g.name }}-proxy
  {{- end }}
  listeners:
    {{- toYaml $g.listeners | nindent 4 }}
{{- end }}
{{- if and $g.enabled (gt (int $g.proxy.replicas) 0) }}
---
# Proxy Deployment overrides for the Gateway above (agentgateway v1.6.0 AgentgatewayParameters, v1alpha1).
# deployment.spec / podDisruptionBudget.spec are strategic-merge overlays onto what the controller generates;
# the PDB selector is filled in by the controller.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ $g.name }}-proxy
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  deployment:
    spec:
      replicas: {{ $g.proxy.replicas }}
      {{- if $g.proxy.softAntiAffinity }}
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        gateway.networking.k8s.io/gateway-name: {{ $g.name }}
      {{- end }}
  {{- if ge (int $g.proxy.replicas) 2 }}
  podDisruptionBudget:
    spec:
      minAvailable: {{ $g.proxy.pdbMinAvailable }}
  {{- end }}
{{- end }}
