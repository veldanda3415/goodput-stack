# llm-d-router-gateway (EPP_VERSION in the Makefile) for the scratch InferencePool `p8-pool` (probe P8, #23).
# Route: `/` + header `x-pool: p8`.
# Two profiles in one ConfigMap, selected by router.epp.pluginsConfigFile (a values switch; the EPP needs a restart):
#   baseline.yaml    = the stock sim-pool profile (queue 2, kv 2, prefix 3) + session-affinity-filter.
#   token-load.yaml  = baseline + upstream inflight-load-producer + token-load-scorer.
# session-affinity-filter is the probe's pin mechanism, not part of the stock profile: with the request header
# `x-session-token: base64("inference/<pod>")` it narrows candidates to that pod (pkg/epp/framework/plugins/scheduling/
# filter/sessionaffinity/session_affinity.go, llm-d-router v0.9.0). Without the header it is a no-op.
router:
  modelServers:
    matchLabels: { app.kubernetes.io/name: vllm-sim-p8 }
  monitoring:
    prometheus:
      auth:
        enabled: false
  epp:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    flags:
      v: "4"
    pluginsConfigFile: baseline.yaml
    pluginsCustomConfig:
      baseline.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: session-affinity-filter
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: metrics-data-source
          parameters:
            scheme: "http"
            path: "/metrics"
            insecureSkipVerify: true
        - type: core-metrics-extractor
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: session-affinity-filter
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
      token-load.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
        - type: session-affinity-filter
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: prefix-cache-scorer
        - type: inflight-load-producer
        - type: token-load-scorer
          parameters:
            queueThresholdTokens: 8192
        - type: metrics-data-source
          parameters:
            scheme: "http"
            path: "/metrics"
            insecureSkipVerify: true
        - type: core-metrics-extractor
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: session-affinity-filter
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: token-load-scorer
            weight: 4
provider:
  name: none
httpRoute:
  create: true
  inferenceGatewayName: inference-gateway
  headerMatches:
    x-pool: p8
