# Scratch backend for the scale-from-zero experiment (GAPS.md P6, #10). SIMULATED.
# Same image/config as the chart's sim (reuses ConfigMap inf-vllm-sim), its own labels so it gets its own
# InferencePool `zero-pool` (release zero-pool, epp-zero.values.yaml) and never joins sim-pool.
# Starts at 0 replicas: KEDA (scaledobject-sim-zero.yaml) owns replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-zero
  namespace: inference
  labels: { app.kubernetes.io/name: vllm-sim-zero, app.kubernetes.io/part-of: goodput-stack, goodput-stack/simulated: "true" }
spec:
  replicas: 0
  selector:
    matchLabels: { app.kubernetes.io/name: vllm-sim-zero }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vllm-sim-zero, app.kubernetes.io/part-of: goodput-stack, goodput-stack/simulated: "true" }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2@sha256:86e9d5028e1de478646911bab6f572b314163c408574188d982529e73e6cf27f
          args: ["--config", "/etc/vllm-sim/config.yaml", "--port", "8000"]
          ports: [{ name: http, containerPort: 8000 }]
          startupProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 1, failureThreshold: 120, timeoutSeconds: 1 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2 }
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/vllm-sim, readOnly: true }]
      volumes: [{ name: config, configMap: { name: inf-vllm-sim } }]
---
# Same allow-list as the chart's backend NetworkPolicies (gateway proxy, EPPs, Prometheus).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sim-zero
  namespace: inference
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: vllm-sim-zero } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: inference-gateway } }
        - podSelector: { matchLabels: { llm-d.ai/igw-mode: llm-d-router-gateway } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 8000, protocol: TCP }]
